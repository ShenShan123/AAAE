[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaae"
version = "0.1.0"
description = "Application accuracy-aware evaluation and approximate multiplier optimization"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scipy", "scikit-learn", "joblib", "lightgbm",
  "torch", "torch-geometric", "onnx", "onnxruntime-gpu", "Pillow", "matplotlib",
  "botorch", "gpytorch"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaae*"]
